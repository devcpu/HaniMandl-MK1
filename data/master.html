<!DOCTYPE html>
<html lang="de">
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%HTMLTILE%</title>
<link rel="stylesheet" href="w3.css">
<!-- <link rel="stylesheet" href="w3pro.css"> -->
<!-- <link rel="stylesheet" href="w3-theme-xcolor.css"> -->

<body class="w3-pale-yellow">
    <nav class="w3-sidebar w3-bar-block w3-card" id="mySidebar">
        <div class="w3-container w3-theme">
            <span onclick="(function(){var s=document.getElementById('mySidebar');var o=document.getElementById('sidebar-overlay');if(s)s.style.display='none';if(o)o.style.display='none';})()" class="w3-button w3-display-topright w3-large" style="cursor:pointer;">X</span>
        </div>
        <a class="w3-bar-item w3-button" onClick="closeSidebar();"></a>
        <a class="w3-bar-item w3-button"  href="/filling">Abfüllen</a>
        <a class="w3-bar-item w3-button" href="/setupfilling">Einstellungen Abfüllung</a>
        <a class="w3-bar-item w3-button" href="/setup">Grundeinrichtung</a>
        <a class="w3-bar-item w3-button" href="/calibrate">Waage kalibrieren</a>
        <a class="w3-bar-item w3-button" href="/hmconfig">Anzeige Konfiguration</a>
        <a class="w3-bar-item w3-button" href="/setupwlan">Konfiguration WLan</a>
        <a class="w3-bar-item w3-button" href="/updatefirmware">Firmware Update</a>
        <a class="w3-bar-item w3-button" href="/systeminfo">System Info</a>
        <a class="w3-bar-item w3-button" href="/reboot">System neu starten</a>
    </nav>
    <header class="w3-bar w3-card w3-theme w3-teal">
        <button class="w3-bar-item w3-button w3-xxlarge w3-hover-theme" onclick="openSidebar()">&#9776;</button>
        <h3 class="w3-bar-item">%H2TITLE%</h3>
    </header>
    <div style='text-align:center;'><noscript>Bitte JavaScript aktivieren, sonst läuft nix!<br /></noscript></div>
    <div id='error' name='errormsg' display: none>%ERRORMSG%</div>
    %BODY%
    <div class="w3-container w3-small w3-margin-top">
        <div class="w3-row-padding w3-border w3-round w3-light-grey">
            <div class="w3-third"><b>Status:</b> <span id="filling_status">-</span></div>
            <div class="w3-third"><b>WiFi:</b> <span id="wifi_state">-</span></div>
            <div class="w3-third"><b>HB Latency:</b> <span id="hb_latency">-</span>s</div>
        </div>
        <div class="w3-row-padding w3-small">
            <div><b>Gläser gesamt:</b> <span id="glass_count">0</span></div>
        </div>
    </div>
    <div style='text-align:right;font-size:11px;'><a href='https://dl7uxa.de' target='_blank' style='color:#aaa;'>Simple Automatic Honey Filling Machine v 0.2 by Jan (DL7UXA)</a>
    </div>
    <script src="honeyFillingMachine.js"></script>
    <script>
        // Close sidebar on load
        if (typeof closeSidebar === 'function') {
            closeSidebar();
        }
    </script>
</body>

</html>
